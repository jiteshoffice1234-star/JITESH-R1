name: Build Android APK

on:
  push:
    tags:
      - 'v*'  # Triggers on tags like v1.0.0, v1.0.1, etc.
  workflow_dispatch:  # Allows manual trigger

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🌐 Build web app
        run: npm run build

      - name: 🤖 Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 📱 Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 🔧 Add Capacitor Android platform
        run: npx cap add android

      - name: 🔄 Sync web assets
        run: npx cap sync android

      - name: 🔨 Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: 📋 Copy APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk SolarSystemExplorer-${{ github.ref_name }}.apk
          echo "APK_SIZE=$(du -h SolarSystemExplorer-${{ github.ref_name }}.apk | cut -f1)" >> $GITHUB_ENV

      - name: 🏷️ Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Solar System Explorer ${{ github.ref_name }}"
          body: |
            ## 🚀 Solar System Explorer ${{ github.ref_name }}
            
            ### 📱 Android APK
            Download **SolarSystemExplorer-${{ github.ref_name }}.apk** below and install on your Android device.
            
            ### 📲 Installation
            1. Download the APK file
            2. Transfer to your Android phone
            3. Enable "Install from Unknown Sources" in Settings
            4. Tap the APK to install
            5. Enjoy exploring the solar system! 🌍🪐☀️
            
            ### 🎮 Features
            - ✅ All 8 planets with smooth orbital animations
            - ✅ Tap any planet for detailed info
            - ✅ Play/Pause and speed controls
            - ✅ Pinch to zoom, drag to pan
            - ✅ Works completely offline
            - ✅ Haptic feedback
            
            ### 📦 File Info
            - **Size:** ${{ env.APK_SIZE }}
            - **Min Android:** 5.0 (API 21)
            - **Type:** Debug APK (can be installed directly)
            
            ---
            Made with ❤️ | [MIT License](LICENSE)
          files: |
            SolarSystemExplorer-${{ github.ref_name }}.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 📤 Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SolarSystemExplorer-APK
          path: SolarSystemExplorer-${{ github.ref_name }}.apk
          retention-days: 30
